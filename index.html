<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教科書 Reader</title>
  <script src="assets/qbank-shared.js?v=20260725"></script>
  <script>if(!window.MathJax)window.MathJax=QBankShared.mathJaxConfig;</script>
  <script src="assets/vendor/mathjax/tex-chtml-full.js" async></script>
  <script src="assets/vendor/marked.min.js"></script>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <!-- ESM 模組圖只有兩層深，但入口檔要先下載解析完，瀏覽器才會發現它的 import。
       modulepreload 讓所有模組與入口同時開始下載，省掉一個 round trip。
       這裡不加 ?v=：/assets/ 由 nginx 發 private,no-cache（見 deploy/nginx.conf），
       且 preload 的 URL 必須與 import 指定的完全一致，否則會下載兩次。 -->
  <link rel="modulepreload" href="assets/js/reader.js">
  <link rel="modulepreload" href="assets/js/shared.js">
  <link rel="modulepreload" href="assets/js/blocks.js">
  <link rel="modulepreload" href="assets/js/store.js">
  <link rel="modulepreload" href="assets/js/router.js">
  <link rel="modulepreload" href="assets/js/search.js">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="assets/qbank-shared.css?v=20260725">
  <!-- CJK 襯線（中譯面板用）：檔案太大不自託管，改非阻塞載入；連不到就退系統宋體，不影響首屏 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap">
  <style>
    :root {
      --article-fs: 18px;
      --article-lh: 1.78;
    }
    body { font-size: 14px; line-height: 1.7; transition: background .25s ease, color .25s ease; }
    /* token(含 dark/skin)全在 design/tokens.css；以下僅留深色「行為」補丁(非 token) */
    body[data-theme="dark"] mjx-container { color: inherit; }

    :root { --qbk-sidebar-width: 250px; }

    /* view switch ─────────────────────────────────────────────────────── */
    #app[data-view="library"] #reader-sidebar-overlay,
    #app[data-view="library"] .reader-only { display: none; }
    #app[data-view="library"] .reader-sidebar-only { display: none; }
    #app[data-view="library"] #library-view { display: block; }
    #app[data-view="library"] #content { display: none; }

    #app[data-view="reader"] #library-view { display: none; }
    #app[data-view="reader"] .library-only { display: none; }
    #app[data-view="reader"] .library-sidebar-only { display: none; }

    /* ── sidebar (reader-only) ───────────────────────────────────────── */
    /* 閱讀側欄比書庫側欄寬 50px：章節標題完整換行後，250px 會讓多數章標吃到 3 行。 */
    #app[data-view="reader"] { --qbk-sidebar-width: 300px; }
    .library-sidebar-only,
    .reader-sidebar-only {
      min-height: 0; height: 100%; display: flex; flex-direction: column;
    }
    #sidebar-header {
      min-height: 52px; padding: 12px 20px 11px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sb-back {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      letter-spacing: .12em; color: var(--sub); text-decoration: none;
      text-transform: uppercase;
      transition: color .15s ease;
    }
    .sb-back:hover { color: var(--ink); }
    .sb-bookname {
      margin-top: 6px;
      font-family: var(--sans); font-size: 16px; font-weight: 600;
      color: var(--text); line-height: 1.3;
    }
    .sb-bookmeta {
      margin-top: 2px;
      font-family: var(--mono); font-size: 10px; color: var(--sub);
      letter-spacing: .04em;
    }

    #toc { flex: 1; overflow-y: auto; padding: 8px 0 14px; }
    #toc::-webkit-scrollbar { width: 3px; }
    #toc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .toc-group-label {
      padding: 14px 20px 6px; font-family: var(--mono); font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .14em; color: var(--sub);
    }
    /* 目錄列 = 真連結(<a href>) + 複製鈕的並排 row。連結不可包按鈕（HTML 非法、
       且鍵盤語意會壞），故列本身是 flex 容器，狀態 class 掛在 row 上。 */
    .toc-row, .toc-sec-row {
      display: flex; align-items: stretch;   /* 連結填滿整列高度 → 多行標題整塊可點 */
      border-left: 2px solid transparent;
      transition: background .12s ease, border-color .12s ease;
    }
    .toc-row:hover, .toc-sec-row:hover { background: var(--bg); }
    .toc-row.active { background: var(--bg); border-left-color: var(--ink); }
    .toc-sec-row.active { background: var(--bg); border-left-color: var(--ink-light); }
    .toc-item {
      flex: 1; min-width: 0;
      display: flex; align-items: baseline; gap: 10px; padding: 8px 6px 8px 20px;
      cursor: pointer; font-size: 13.5px; line-height: 1.4;
      color: var(--text); text-decoration: none;
    }
    .toc-row.active .toc-item { font-weight: 600; }
    .toc-num { font-family: var(--mono); font-size: 11px; color: var(--sub); flex-shrink: 0; min-width: 34px; }
    .toc-row.active .toc-num { color: var(--ink); }
    /* 章/節標題一律完整換行，不用 ellipsis 截斷：側欄是導航的唯一入口，
       「Techniques of Circuit Analysis」被截成「Techniques ...」等於失去導航價值。
       overflow-wrap:anywhere 只在遇到超長不可斷詞（化學式/URL）時才硬斷。 */
    .toc-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .toc-meta { font-family: var(--mono); font-size: 9px; color: var(--sub); flex-shrink: 0; }
    .toc-caret {
      flex-shrink: 0; width: 10px; font-family: var(--mono); font-size: 9px;
      color: var(--sub); text-align: center; transition: transform .15s ease;
      display: inline-block; opacity: .6;
    }
    .toc-item.has-children { padding-left: 18px; gap: 8px; }
    .toc-row.expanded .toc-caret { transform: rotate(90deg); opacity: 1; }
    .toc-section-list { display: none; padding: 2px 0 8px; }
    .toc-row.expanded + .toc-section-list { display: block; }
    .toc-sec {
      flex: 1; min-width: 0;
      display: flex; align-items: baseline; gap: 10px; cursor: pointer;
      padding: 5px 6px 5px 52px; font-size: 12.5px; line-height: 1.45;
      color: var(--ink-light); text-decoration: none;
      transition: color .12s ease;
    }
    .toc-sec-row:hover .toc-sec { color: var(--text); }
    .toc-sec-row.active .toc-sec { color: var(--ink); }
    .toc-sec[data-level="3"] { padding-left: 72px; font-size: 11.5px; color: var(--sub); }
    .toc-sec-num { font-family: var(--mono); font-size: 10px; color: var(--sub); flex-shrink: 0; min-width: 28px; }
    .toc-sec-row.active .toc-sec-num { color: var(--ink); }
    /* 節標題封頂 4 行：真節標最多 2 行，只有被誤判成節的題幹散文（OCR 髒資料）
       會爆長，不設上限會讓單一壞列撐開整個側欄。章標題不設限（必為真標題）。 */
    .toc-sec-title {
      flex: 1; min-width: 0; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── 章/節複製按鈕 ────────────────────────────────────────────────── */
    .toc-copy {
      flex-shrink: 0; margin-right: 8px; align-self: center;
      opacity: 0;
    }
    .toc-row:hover .toc-copy, .toc-sec-row:hover .toc-copy { opacity: .65; }
    .toc-copy:focus-visible { opacity: 1; }
    .toc-copy:hover, .toc-copy.copied { opacity: 1 !important; }

    .reader-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .reader-tab {
      border: 1px solid transparent; background: transparent; color: var(--sub);
      font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em;
      padding: 6px 8px; border-radius: 4px; cursor: pointer; text-transform: uppercase;
    }
    .reader-tab:hover { color: var(--ink); background: var(--bg); }
    .reader-tab.active { color: var(--ink); border-color: var(--border); background: var(--bg); }
    #catalog-panel, #search-panel {
      display: none; flex: 1; min-height: 0; overflow: hidden; flex-direction: column;
      border-top: 0;
    }
    /* ── 書內搜尋 ─────────────────────────────────────────────────────── */
    .search-status {
      padding: 7px 12px; font-family: var(--mono); font-size: 9.5px; line-height: 1.5;
      color: var(--sub); border-bottom: 1px solid var(--border-l); min-height: 15px;
    }
    .search-results { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 14px; }
    .search-hit-row {
      display: block; width: 100%; text-align: left; padding: 9px 12px; cursor: pointer;
      border: 0; border-left: 2px solid transparent; background: transparent;
      color: var(--text); font: inherit;
    }
    .search-hit-row:hover { background: var(--bg); }
    .search-hit-row.active { border-left-color: var(--ink); background: var(--bg); }
    .search-hit-where {
      font-family: var(--mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--sub); margin-bottom: 3px;
    }
    .search-hit-text { font-size: 12px; line-height: 1.5; color: var(--ink-light); overflow-wrap: anywhere; }
    .search-hit-text mark { background: color-mix(in srgb, var(--ink) 16%, transparent); color: var(--ink); }
    .search-group {
      padding: 10px 12px 4px; font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--sub);
    }
    .search-more {
      margin: 8px 12px; width: calc(100% - 24px);
    }
    /* 正文裡的命中：閱讀時看得見但不刺眼；目前跳到的那一顆再強調一層 */
    mark.search-hit { background: color-mix(in srgb, var(--ink) 15%, transparent); color: inherit; border-radius: 2px; }
    mark.search-hit.current { background: color-mix(in srgb, var(--ink) 34%, transparent); }
    .catalog-tools { padding: 10px 12px 8px; border-bottom: 1px solid var(--border-l); }
    .catalog-search {
      width: 100%; height: 32px; padding: 0 9px;
      font-family: var(--mono); font-size: 11px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text);
    }
    .catalog-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
    .catalog-type {
      border: 1px solid var(--border-l); background: transparent; color: var(--sub);
      font-family: var(--mono); font-size: 9px; letter-spacing: .04em;
      padding: 5px 4px; border-radius: 4px; cursor: pointer;
    }
    .catalog-type.active { color: var(--ink); border-color: var(--border); background: var(--bg); font-weight: 700; }
    .catalog-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 14px; }
    .catalog-item {
      display: flex; gap: 9px; padding: 8px 12px; cursor: pointer;
      border-left: 2px solid transparent; color: var(--text);
    }
    .catalog-item:hover { background: var(--bg); }
    .catalog-item.active { border-left-color: var(--ink); background: var(--bg); }
    .catalog-thumb {
      width: 56px; height: 44px; flex: 0 0 56px;
      border: 1px solid var(--border-l); border-radius: 3px;
      object-fit: contain; background: #fff;
    }
    body[data-theme="dark"] .catalog-thumb[data-kind="line"] { filter: invert(1) hue-rotate(180deg); }
    .catalog-body { min-width: 0; flex: 1; }
    .catalog-id { font-family: var(--mono); font-size: 10px; color: var(--ink); font-weight: 700; }
    .catalog-meta { font-family: var(--mono); font-size: 9px; color: var(--sub); margin-top: 1px; }
    .catalog-text {
      margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: var(--ink-light);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .catalog-empty {
      padding: 34px 14px; text-align: center; color: var(--sub);
      font-family: var(--mono); font-size: 11px; line-height: 1.6;
    }
    .catalog-load-more {
      display: block; width: calc(100% - 24px); margin: 8px 12px 0;
    }
    #catalog-detail-modal {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: rgba(8, 7, 5, .48); align-items: center; justify-content: center;
      padding: 18px;
    }
    #catalog-detail-modal.open { display: flex; }
    .catalog-detail-dialog {
      width: min(860px, 96vw); max-height: 88vh; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 20px 70px rgba(0,0,0,.28);
    }
    .catalog-detail-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .catalog-detail-title {
      font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink);
    }
    .catalog-detail-meta {
      margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--sub);
    }
    .catalog-detail-body {
      overflow: auto; padding: 18px; font-family: var(--article-font);
      color: var(--text); background: var(--surface);
    }
    .catalog-detail-body figure,
    .catalog-detail-body .tbl,
    .catalog-detail-body .eq { margin: 0; }
    .catalog-detail-body figure img {
      display: block; max-width: 100%; max-height: 62vh; object-fit: contain;
      margin: 0 auto; background: #fff; border: 1px solid var(--border-l);
    }
    body[data-theme="dark"] .catalog-detail-body figure[data-kind="line"] img {
      filter: invert(1) hue-rotate(180deg);
    }
    .catalog-detail-body .eq { overflow-x: auto; padding: 16px 4px; }
    .catalog-detail-body .catalog-detail-fallback {
      font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--sub);
      padding: 18px; border: 1px dashed var(--border); border-radius: 4px;
    }
    .catalog-detail-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 10px 14px; border-top: 1px solid var(--border);
    }

    /* ── 鍵盤快捷鍵說明 ───────────────────────────────────────────────── */
    #shortcuts-modal {
      display: none; position: fixed; inset: 0; z-index: 10001;
      background: rgba(8, 7, 5, .48); align-items: center; justify-content: center; padding: 18px;
    }
    #shortcuts-modal.open { display: flex; }
    .shortcuts-dialog {
      width: min(420px, 96vw);
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 20px 70px rgba(0,0,0,.28);
    }
    .shortcuts-list {
      display: grid; grid-template-columns: auto 1fr; gap: 10px 16px;
      padding: 16px 18px 20px; align-items: center;
    }
    .shortcuts-list kbd {
      font-family: var(--mono); font-size: 11px; color: var(--ink);
      border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
      padding: 3px 8px; background: var(--bg); white-space: nowrap;
    }
    .sc-desc { font-size: 13px; color: var(--text); }

    /* ── main ───────────────────────────────────────────────────────── */
    #main { transition: background .25s ease; }
    #topbar { transition: background .25s ease, border-color .25s ease; }
    #crumb { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #crumb .cur { color: var(--text); font-weight: 600; }

    /* ── library view ──────────────────────────────────────────────── */
    #library-view { display: none; flex: 1; overflow: hidden; }
    #library-view::-webkit-scrollbar { width: 5px; }
    #library-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

    .library-rail { gap: 0; }
    .library-subjects { margin-bottom: 18px; }
    .library-rail-stats {
      display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border-l);
      font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .03em;
    }
    .library-rail-stats strong { color: var(--ink); font-size: 12px; }
    .lib-wrap { height: 100%; overflow-y: auto; padding: 20px 28px 48px; }
    .lib-wrap::-webkit-scrollbar { width: 4px; }
    .lib-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .lib-search {
      max-width: 320px;
      padding-left: 12px;
    }

    .lib-group { margin-bottom: 44px; }
    /* 領域 = 圖書館大分區：粗襯線大標 + 深色厚底線，最高層級 */
    .lib-group-label {
      display: flex; align-items: baseline; gap: 12px;
      font-family: var(--sans); font-size: 22px; font-weight: 700;
      color: var(--text); letter-spacing: 0;
      padding-bottom: 10px; margin-bottom: 20px;
      border-bottom: 2px solid var(--ink);
    }
    .lib-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    .lib-card {
      padding: 0; background: var(--surface);
      cursor: pointer; text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: background .25s ease;
    }
    .lib-card:hover { box-shadow: var(--shadow-card); }
    .lib-card-cover {
      width: 100%; aspect-ratio: 3 / 4; overflow: hidden;
      background: var(--bg); border-bottom: 1px solid var(--border-l);
      display: flex; align-items: center; justify-content: center;
    }
    .lib-card-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: filter .25s ease;
    }
    body[data-theme="dark"] .lib-card-cover img { filter: brightness(.92); }
    .lib-card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .lib-card-title {
      font-family: var(--sans); font-size: 15px; font-weight: 600; line-height: 1.25;
      color: var(--text);
    }
    .lib-card-author {
      font-family: var(--sans); font-size: 11.5px; color: var(--sub); line-height: 1.35;
      font-style: italic;
    }
    .lib-card-meta {
      margin-top: auto; padding-top: 6px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-family: var(--mono); font-size: 9px; color: var(--sub); letter-spacing: .04em;
    }
    .lib-card-meta .edition {
      padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-light);
    }
    .lib-card-meta .zh-badge {
      padding: 2px 7px; border: 1px solid var(--ink-light); border-radius: 3px;
      color: var(--ink); font-weight: 600; letter-spacing: .06em;
    }
    .lib-card-meta .sol-badge {
      padding: 2px 7px; border: 1px solid var(--accent, var(--ink-light)); border-radius: 3px;
      color: var(--accent, var(--ink)); font-weight: 600; letter-spacing: .06em;
    }
    /* 收錄表：領域群組統計 + 具名子單標題 */
    .lib-group-stat {
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      color: var(--sub); letter-spacing: .08em; margin-left: auto;
    }
    /* 子單 = 書架：左側導引線縮排 → 視覺上隸屬於領域 */
    .lib-sublist { margin-bottom: 22px; padding-left: 18px; border-left: 2px solid var(--border-l); }
    .lib-sublist:last-child { margin-bottom: 0; }
    .lib-sublist-label {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px; font-weight: 700; font-style: normal;
      text-transform: uppercase; letter-spacing: .12em; color: var(--ink-light);
      margin-bottom: 12px;
    }
    .lib-sublist-label::before {
      content: ''; width: 14px; height: 1px; background: var(--ink-light); flex-shrink: 0;
    }
    /* ghost 卡：待收錄/無法收錄，不可點，淡化呈現 */
    .lib-card-ghost {
      cursor: default;
      border: 1px dashed var(--border); background: transparent;
      opacity: .72;
    }
    .lib-card-ghost .lib-card-title { color: var(--sub); font-weight: 500; }
    .lib-card-ghost.shelf-absent { opacity: .5; }
    .shelf-pill {
      padding: 2px 7px; border-radius: 3px; font-weight: 600; letter-spacing: .06em;
    }
    .shelf-pill.shelf-pending { border: 1px solid var(--border); color: var(--sub); }
    .shelf-pill.shelf-processing { border: 1px dashed var(--border); color: var(--sub); }
    .shelf-pill.shelf-absent {
      border: 1px solid var(--border-l); color: var(--sub);
      text-decoration: line-through; text-decoration-thickness: 1px;
    }
    .lib-empty {
      padding: 60px 20px; text-align: center; color: var(--sub);
      font-family: var(--mono); font-size: 12px;
    }

    /* ── content / article ─────────────────────────────────────────── */
    #content {
      flex: 1; min-width: 0;
      overflow-y: auto; overflow-x: hidden;
      overscroll-behavior-x: none;
    }
    #content::-webkit-scrollbar { width: 5px; }
    #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    .article {
      max-width: var(--article-max-width, 880px); margin: 0 auto; padding: 56px 72px 120px;
      font-family: var(--article-font); font-size: var(--article-fs); line-height: var(--article-lh);
      min-width: 0;
    }
    .article p { margin: 0 0 18px; font-feature-settings: 'kern','liga','lnum'; }
    .article h1, .article h2, .article h3 { font-family: var(--article-font); font-feature-settings: 'kern','liga'; }
    .article h1 { font-size: 30px; font-weight: 700; margin: 0 0 8px; letter-spacing: 0; line-height: 1.2; }
    .article h1 .ch-num { font-family: var(--mono); font-size: 12px; color: var(--sub); letter-spacing: .14em; display: block; margin-bottom: 10px; text-transform: uppercase; }
    .article h2 { font-size: 22px; font-weight: 700; margin: 44px 0 16px; padding-bottom: 6px; border-bottom: 1px solid var(--border-l); }
    .article h3 { font-size: 17px; font-weight: 700; margin: 30px 0 12px; color: var(--text); }
    .article .sec-h .sec-num { font-family: var(--mono); font-weight: 500; color: var(--sub); margin-right: 8px; font-size: .85em; letter-spacing: .03em; }
    .article .sec-h { scroll-margin-top: 24px; }
    .problem-body { font-family: var(--article-font); }

    /* ── 雙語模式：英文原文預設，點 block 展開中譯 ───────────────────── */
    .bi-block {
      margin: 0 0 18px;
    }
    .bi-block > summary {
      list-style: none;
      cursor: pointer;
      border-radius: 6px;
      transition: background .15s ease;
    }
    .bi-block > summary::-webkit-details-marker { display: none; }
    .bi-block > summary:hover {
      background: color-mix(in srgb, var(--ink) 5%, transparent);
    }
    .bi-block > summary p { margin-bottom: 0; }
    .bi-block[open] > summary {
      margin-bottom: 8px;
    }
    .bi-panel {
      font-family: var(--cjk-serif);
      color: var(--ink-light); font-size: .94em; line-height: 1.85;
      margin: 4px 0 20px; padding: 10px 14px 10px 16px;
      border-left: 2px solid var(--border-l);
      background: color-mix(in srgb, var(--surface) 70%, transparent);
      border-radius: 0 6px 6px 0;
    }
    .bi-panel p { margin: 0 0 8px; }
    .bi-panel p:last-child { margin-bottom: 0; }
    .bi-reveal {
      display: inline-flex; align-items: center; gap: 6px;
      margin: -4px 0 18px;
      font-family: var(--mono); font-size: 10px; color: var(--sub);
      letter-spacing: .04em;
    }
    .bi-reveal > summary {
      list-style: none; cursor: pointer; padding: 2px 0;
      border-bottom: 1px solid transparent;
    }
    .bi-reveal > summary::-webkit-details-marker { display: none; }
    .bi-reveal > summary:hover { color: var(--ink); border-bottom-color: var(--border); }
    .bi-reveal[open] { display: block; }
    .bi-reveal[open] > summary { display: inline-block; margin-bottom: 8px; color: var(--ink); }
    .bi-reveal .bi-panel { margin-bottom: 0; }

    .eq {
      margin: 14px 0; text-align: center; position: relative; cursor: pointer; border-radius: 6px;
      transition: background .15s ease;
      max-width: 100%; overflow: visible;
    }
    .eq mjx-container[display="true"] {
      max-width: 100%; margin: 0 !important;
      overflow-x: auto !important; overflow-y: hidden !important;
    }
    .eq mjx-container[display="true"] mjx-math { overflow: visible !important; }
    .eq .label { font-family: var(--mono); font-size: 11px; color: var(--sub); }
    /* ── 數學式複製 affordance ─────────────────────────────────────────── */
    .eq:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
    .eq::after {
      content: '⧉ 複製 LaTeX'; position: absolute; top: 2px; right: 8px;
      font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--sub);
      opacity: 0; transition: opacity .15s ease; pointer-events: none;
    }
    .eq:hover::after { opacity: .75; }
    .eq.copied::after { content: '✓ 已複製'; color: var(--ink); opacity: 1; }
    .qb-inline-math { border-radius: 3px; transition: background .12s ease; }
    .qb-inline-math:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    #copy-toast {
      position: fixed; bottom: 28px; left: 50%; z-index: 10000;
      transform: translateX(-50%) translateY(8px);
      padding: 8px 18px; border-radius: 6px;
      background: var(--ink); color: var(--bg);
      font-family: var(--mono); font-size: 12px; letter-spacing: .03em;
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    #copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .article figure { margin: 22px 0; text-align: center; }
    /* 版位預留：每張圖由 renderBlock 內聯 width + aspect-ratio（來自 bake 讀到的 webp 尺寸），
       所以「還沒載入」時就有正確高度、不會把下方文字往下推。max-height 仍為極端長圖設上限，
       此時靠 object-fit:contain 保比例（不壓扁）。 */
    .article figure img {
      max-width: min(100%, 480px); max-height: 42vh; object-fit: contain;
      border: 1px solid var(--border-l); border-radius: 3px;
      cursor: zoom-in; background: #fff;
      transition: filter .25s ease, border-color .25s ease, opacity .15s ease;
    }
    .article figure img:hover { opacity: .92; }
    /* 相鄰 figure 自動並排（MinerU 常把 (a)(b) 子圖拆成獨立 block） */
    .fig-row {
      display: flex; flex-wrap: wrap; gap: 16px;
      align-items: flex-start; justify-content: center;
      margin: 22px 0;
    }
    .fig-row figure { margin: 0; flex: 1 1 240px; max-width: 480px; }
    .fig-row figure img { max-width: 100%; max-height: 36vh; object-fit: contain; }
    /* 暗色：線條圖反相（黑線→白線、白底→黑底），照片溫和 dim */
    body[data-theme="dark"] .article figure[data-kind="line"] img {
      filter: invert(1) hue-rotate(180deg);
      background: #fff;  /* 反相後 #fff → #000，融入暗底 */
      border-color: var(--border);
    }
    body[data-theme="dark"] .article figure[data-kind="photo"] img,
    body[data-theme="dark"] .article figure:not([data-kind]) img {
      filter: brightness(.88) contrast(1.04);
      border-color: var(--border);
    }
    .article figcaption { margin-top: 12px; font-size: 13px; color: var(--sub); font-style: italic; }

    /* ── lightbox（點圖放大看原圖） ───────────────────────────────────── */
    #lightbox {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(8, 7, 5, .88); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 32px;
      cursor: zoom-out; animation: lb-fade .15s ease;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 95vw; max-height: 95vh; object-fit: contain;
      background: #fff; border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      cursor: zoom-out;
      /* lightbox 內永遠看原圖，不套 invert/dim */
      filter: none !important;
    }
    #lightbox-caption {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      max-width: 80vw; padding: 6px 14px;
      background: rgba(0,0,0,.5); color: #f1ead9; border-radius: 4px;
      font-family: var(--serif); font-size: 13px; font-style: italic;
      text-align: center; pointer-events: none;
    }
    #lightbox-close {
      position: absolute; top: 18px; right: 24px;
      width: 36px; height: 36px; border: 0; background: rgba(255,255,255,.08);
      color: #f1ead9; border-radius: 50%; cursor: pointer;
      font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s ease;
    }
    #lightbox-close:hover { background: rgba(255,255,255,.18); }
    @keyframes lb-fade { from { opacity: 0; } to { opacity: 1; } }
    .tbl { margin: 22px 0; overflow-x: auto; }
    .tbl table { border-collapse: collapse; font-size: 14px; margin: 0 auto; }
    .tbl th, .tbl td { border: 1px solid var(--border); padding: 6px 14px; }
    .tbl-cap, .tbl-fn { font-size: 12.5px; color: var(--sub); text-align: center; margin: 6px 0; font-style: italic; }

    .example { margin: 22px 0; padding: 14px 20px; background: var(--bg); border-left: 3px solid var(--ink-light); border-radius: 0 4px 4px 0; }
    .example-marker { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink); text-transform: uppercase; }

    /* problems */
    .problems-section { margin-top: 60px; padding-top: 28px; border-top: 2px solid var(--ink); }
    .problems-section > h2 { border: 0; font-size: 24px; margin-top: 0; }
    .problem {
      margin: 0 0 22px; padding: 20px 24px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface);
      transition: background .25s ease, border-color .25s ease;
    }
    .problem-num {
      font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em;
      color: var(--ink); margin-bottom: 10px; text-transform: uppercase;
    }
    .problem-body p:last-child { margin-bottom: 0; }
    .problem-body-empty {
      font-family: var(--mono); font-size: 12px; color: var(--sub);
      padding: 8px 12px; border-left: 2px solid var(--border);
      background: var(--surface); font-style: italic;
    }
    .problem-tools {
      display: flex; justify-content: flex-end; margin-bottom: 8px;
    }
    .problem-open {
      font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--sub); text-decoration: none;
      border: 1px solid var(--border); border-radius: 3px;
      padding: 3px 8px;
    }
    .problem-open:hover { color: var(--ink); border-color: var(--ink-light); }
    .problem-solution { margin-top: 14px; }
    .problem-solution summary {
      cursor: pointer; font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; color: var(--sub); text-transform: uppercase;
      padding: 6px 0; user-select: none;
    }
    .problem-solution summary:hover { color: var(--ink); }
    .problem-solution[open] summary { color: var(--ink); margin-bottom: 10px; }
    .problem-solution .solution-body {
      padding: 14px 16px; border-left: 2px solid var(--border);
      font-family: var(--article-font);
    }
    .problem-solution .solution-body p:last-child { margin-bottom: 0; }

    #empty, #loading {
      display: flex; align-items: center; justify-content: center; flex: 1;
      color: var(--sub); font-family: var(--mono); font-size: 12px; padding: 40px;
      text-align: center;
    }
    .chunk-error {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 80px 20px; color: var(--sub); font-family: var(--mono); font-size: 12px;
    }
    /* 骨架屏：章節載入中先撐出版心與段落節奏，避免「空白 → 內容」的突兀跳動 */
    .skeleton {
      max-width: var(--article-max-width, 880px); margin: 0 auto;
      padding: 56px 72px; animation: sk-in .2s ease;
    }
    .sk-bar {
      height: 13px; margin-bottom: 14px; border-radius: 4px;
      background: linear-gradient(90deg, var(--border-l) 25%, var(--bg) 37%, var(--border-l) 63%);
      background-size: 400% 100%;
      animation: sk-shimmer 1.4s ease-in-out infinite;
    }
    .sk-bar.title { height: 30px; width: 60%; margin-bottom: 34px; }
    .sk-bar.short { width: 42%; margin-bottom: 34px; }
    @keyframes sk-shimmer { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }
    @keyframes sk-in { from { opacity: 0 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .sk-bar { animation: none; }
      * { scroll-behavior: auto !important; }
    }
    @media (max-width: 768px) {
      .skeleton { padding: 28px 22px; }
    }

    @media (max-width: 768px) {
      .article { padding: 28px 22px 80px; }
      #app[data-view="library"] #sidebar {
        position: static; left: auto; top: auto; bottom: auto; z-index: auto;
        width: 210px; transition: none;
      }
      #app[data-view="library"] .library-rail { padding: 12px; }
      .lib-wrap { padding: 16px 12px 60px; }
      .lib-search { max-width: none; }
    }
  </style>
</head>
<body>
<div id="app" class="qbk-app" data-view="library">
  <div id="reader-sidebar-overlay" class="qbk-sidebar-overlay"></div>
  <aside id="sidebar" class="qbk-sidebar">
    <div class="library-sidebar-only">
      <div class="library-sidebar-header qbk-sidebar-header">
        <h1><a href="#" id="lib-home">參考書</a></h1>
      </div>
      <div class="library-rail qbk-sidebar-body qbk-scroll">
        <label class="library-rail-label qbk-filter-label">領域 field</label>
        <div class="library-subjects qbk-chip-group" id="library-subjects"></div>
        <div class="library-rail-stats">
          <div><strong id="library-stat-books">—</strong> 已收錄</div>
          <div><strong id="library-stat-chapters">—</strong> 目標正典</div>
          <div><strong id="library-stat-translated">—</strong> 待收錄</div>
        </div>
      </div>
    </div>
    <div class="reader-sidebar-only">
      <div id="sidebar-header">
        <a class="sb-back" href="#" id="sb-back">← Library</a>
        <div class="sb-bookname" id="sb-bookname">—</div>
        <div class="sb-bookmeta" id="sb-bookmeta"></div>
      </div>
      <div class="reader-tabs" id="reader-tabs">
        <button class="reader-tab active" type="button" data-sidebar-mode="toc">TOC</button>
        <button class="reader-tab" type="button" data-sidebar-mode="search">Search</button>
        <button class="reader-tab" type="button" data-sidebar-mode="catalog">Catalog</button>
      </div>
      <div id="toc"></div>
      <div id="search-panel">
        <div class="catalog-tools">
          <input class="catalog-search" id="book-search" type="search" placeholder="搜尋本書全文…" autocomplete="off">
        </div>
        <div class="search-status" id="search-status"></div>
        <div class="search-results" id="search-results"></div>
      </div>
      <div id="catalog-panel">
        <div class="catalog-tools">
          <input class="catalog-search" id="catalog-search" type="search" placeholder="搜尋圖表…" autocomplete="off">
          <div class="catalog-types" id="catalog-types">
            <button class="catalog-type active" type="button" data-catalog-type="figures">Figures</button>
            <button class="catalog-type" type="button" data-catalog-type="tables">Tables</button>
            <button class="catalog-type" type="button" data-catalog-type="equations">Equations</button>
          </div>
        </div>
        <div class="catalog-list" id="catalog-list"></div>
      </div>
      <div id="sidebar-footer" class="qbk-sidebar-footer"></div>
    </div>
  </aside>

  <div id="main" class="qbk-main">
    <div id="topbar" class="qbk-topbar">
      <button class="reader-only qbk-drawer-btn" id="btn-reader-sidebar" type="button" aria-label="切換章節">☰</button>
      <div id="crumb" class="reader-only"></div>
      <div class="topbar-spacer reader-only"></div>
      <div class="topbar-spacer library-only"></div>
      <a class="utility-link" href="problems.html">Problems</a>
      <input class="lib-search library-only qbk-search" id="lib-search" type="search" placeholder="搜尋書名或作者…" autocomplete="off">
      <span class="meta library-only qbk-result-count" id="library-count"></span>
      <button class="qbk-control-btn reader-only" id="btn-prev" disabled>← prev</button>
      <button class="qbk-control-btn reader-only" id="btn-next" disabled>next →</button>
      <button class="qbk-icon-btn" id="btn-shortcuts" type="button" title="鍵盤快捷鍵（按 ?）" aria-label="鍵盤快捷鍵">?</button>
      <div class="qbk-popover-wrap">
        <button class="qbk-icon-btn" id="btn-settings" title="顯示設置" aria-haspopup="true" aria-expanded="false">⚙</button>
        <div class="qbk-popover" id="settings-pop" role="dialog" aria-label="顯示設置">
          <div class="qbk-control-panel-head">
            <div>
              <div class="qbk-control-panel-title">Reader</div>
              <div class="qbk-control-panel-meta" id="reader-panel-state">Library</div>
            </div>
            <button class="qbk-icon-btn compact" id="btn-panel-copy" type="button" title="複製目前章節" aria-label="複製目前章節" disabled>⧉</button>
          </div>
          <div class="qbk-control-row">
            <span class="qbk-control-label">主題</span>
            <div class="qbk-segmented" id="seg-theme">
              <button data-theme="auto">Auto</button>
              <button data-theme="light">Light</button>
              <button data-theme="dark">Dark</button>
            </div>
          </div>
          <div class="qbk-control-row">
            <span class="qbk-control-label">語言</span>
            <div class="qbk-segmented" id="seg-lang">
              <button data-lang="en">English</button>
              <button data-lang="zh">中文</button>
              <button data-lang="bi">雙語</button>
            </div>
          </div>
          <div class="qbk-control-row">
            <div class="qbk-control-label-line">
              <span class="qbk-control-label">字級</span>
              <span class="qbk-control-value" id="fs-value">18px</span>
            </div>
            <input class="qbk-slider" id="slider-fs" type="range" min="1" max="10" step="1" aria-label="字級">
            <div class="qbk-slider-scale"><span>小</span><span>大</span></div>
          </div>
          <div class="qbk-control-row">
            <div class="qbk-control-label-line">
              <span class="qbk-control-label">行高</span>
              <span class="qbk-control-value" id="lh-value">1.82</span>
            </div>
            <input class="qbk-slider" id="slider-lh" type="range" min="1" max="10" step="1" aria-label="行高">
            <div class="qbk-slider-scale"><span>密</span><span>疏</span></div>
          </div>
          <div class="qbk-control-row">
            <div class="qbk-control-label-line">
              <span class="qbk-control-label">版心</span>
              <span class="qbk-control-value" id="width-value">880px</span>
            </div>
            <input class="qbk-slider" id="slider-width" type="range" min="1" max="10" step="1" aria-label="版心">
            <div class="qbk-slider-scale"><span>窄</span><span>寬</span></div>
          </div>
          <div class="qbk-control-actions">
            <button class="qbk-control-btn" id="btn-panel-prev" type="button" disabled>Prev</button>
            <button class="qbk-control-btn" id="btn-panel-next" type="button" disabled>Next</button>
            <button class="qbk-control-btn" id="btn-panel-copy-text" type="button" disabled>Copy</button>
          </div>
        </div>
      </div>
    </div>

    <div id="library-view">
      <div class="lib-wrap qbk-scroll">
        <div id="lib-groups"></div>
      </div>
    </div>

    <div id="content"><div id="loading">loading...</div></div>
  </div>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="圖片放大" tabindex="-1">
  <button id="lightbox-close" aria-label="關閉">✕</button>
  <img id="lightbox-img" alt="">
  <div id="lightbox-caption"></div>
</div>

<div id="shortcuts-modal" role="dialog" aria-modal="true" aria-label="鍵盤快捷鍵" tabindex="-1">
  <div class="shortcuts-dialog">
    <div class="catalog-detail-head">
      <div>
        <div class="catalog-detail-title">鍵盤快捷鍵</div>
        <div class="catalog-detail-meta">在輸入框內不觸發</div>
      </div>
      <button class="qbk-icon-btn compact" id="shortcuts-close" type="button" aria-label="關閉">✕</button>
    </div>
    <div class="shortcuts-list" id="shortcuts-list"></div>
  </div>
</div>

<div id="catalog-detail-modal" role="dialog" aria-modal="true" aria-label="Catalog detail" tabindex="-1">
  <div class="catalog-detail-dialog">
    <div class="catalog-detail-head">
      <div>
        <div class="catalog-detail-title" id="catalog-detail-title">Catalog</div>
        <div class="catalog-detail-meta" id="catalog-detail-meta"></div>
      </div>
      <button class="qbk-icon-btn compact" id="catalog-detail-close" type="button" aria-label="關閉">✕</button>
    </div>
    <div class="catalog-detail-body" id="catalog-detail-body"></div>
    <div class="catalog-detail-actions">
      <button class="qbk-control-btn compact" id="catalog-detail-cancel" type="button">Close</button>
      <button class="qbk-control-btn compact" id="catalog-detail-navigate" type="button">Navigate</button>
    </div>
  </div>
</div>

<script type="module" src="assets/js/reader.js"></script>
</body>
</html>
