# 白名單式服務：mount 的是整個 repo 根，故只開放靜態 reader 資源，
# 其餘（.env / book_pipeline / .git / *.py / raw_pdfs / mineru_data …）一律封鎖，杜絕憑證/原始碼外洩。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        application/json        json;
        image/webp              webp;
        image/jpeg              jpg jpeg;
        image/x-icon            ico;
        font/woff2              woff2;
        font/woff               woff;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json;  # text/html 預設即 gzip，列出會觸發 duplicate warn
    gzip_min_length 1024;
    # webp / woff2 已內建壓縮，不再 gzip

    # 首頁（hash 路由 SPA，server 端不需 rewrite）
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # 靜態題目瀏覽器（hash 路由 SPA，餵 /data 同源 JSON）
    location = /problems.html {
        try_files /problems.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /favicon.ico { try_files /favicon.ico =404; access_log off; log_not_found off; }

    # 前端共用 JS/CSS（本專案自己的碼，改了要馬上見效）。
    # `private` 是關鍵：Cloudflare 預設會把 .js/.css 收進邊緣快取，並把 no-cache 改寫成
    # max-age=14400（取 zone Browser TTL 與源頭 TTL 的較大者）→ 改了碼要 4 小時才傳到使用者。
    # 標 private 讓 CF 完全不收（cf-cache-status: DYNAMIC），瀏覽器則靠 no-cache 每次 304 重驗。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "private, no-cache";
    }

    # 自託管第三方資產（MathJax / marked / 字型檔）：內容綁版本，換版即換檔名 → 永久快取。
    # nginx 前綴 location 取「最長匹配」而非書寫順序，故這兩段自動蓋過上面的 /assets/。
    location /assets/vendor/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 例外：字型的 @font-face 清單是我們自己的檔，會改 → 精確匹配優先於上面的前綴匹配。
    location = /assets/fonts/fonts.css {
        try_files $uri =404;
        add_header Cache-Control "private, no-cache";   # private 之必要見上 /assets/ 段
    }

    # 圖片：content-addressed hash，長快取
    location /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 烤好的 JSON：re-bake 後須即時可見
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 設計系統：reader / problems / dev 皆 <link> /design/tokens.css 取全站 CSS 變數。
    # 換皮(改 tokens.css)須即時可見 → no-cache。內含 tokens.css / preview.html / DESIGN.md，無機密。
    location /design/ {
        try_files $uri =404;
        add_header Cache-Control "private, no-cache";   # private 之必要見上 /assets/ 段
    }

    # dev 監控頁（index.html + devctl 定時重生的 status.json）。
    # ⚠️ 內含 log/書名/錯誤訊息 → 公網存取必須由 Cloudflare Access（信箱閘）擋。
    #    Access 設好前，先要求 cloudflared 在 tunnel 層注入的 Cf-Access-Authenticated-User-Email
    #    （無此 header = 未過 Access）→ 擋掉裸連。設好 Access 後此 header 由 CF 保證存在。
    # /dev 已純觀測：無寫回端點（控制全走 CLI devctl gates/pause/resume）。原 `location ^~ /dev/api/`
    # proxy 給 devcontrol sidecar 的區塊已隨 sidecar 一併移除。/dev/ 僅靜態 serve 觀測頁與 dev/*.json。
    location ^~ /dev/ {
        if ($http_cf_access_authenticated_user_email = "") { return 403; }
        try_files $uri ${uri}index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 書封白名單：未部署書（OCR/audit/catalog 階段）的封面只有 mineru_data/<slug>/cover.jpg，
    # 尚無 /img webp。**僅**放行恰好匹配 .../mineru_data/<slug>/cover.jpg 者（正則錨定 → 無法
    # 穿越到 .py / content_list.json / extract_rules.yaml / raw_pdfs 等）→ /dev 產線每本即時有封面。
    location ~ ^/book_pipeline/mineru_data/[a-z0-9_]+/cover\.jpg$ {
        try_files $uri =404;
        # immutable 長快取：devctl 給的 URL 帶 ?v=<mtime>，封面換版即換 URL（內容定址）。
        # 故可比照 /img webp 永久快取 → 瀏覽器載一次即不再每次 render 重抓，杜絕 no-cache
        # 下「每 8s innerHTML 重建 → 逐圖重新 revalidate → 偶發失敗就破圖且不復原」的脆弱性。
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 其餘路徑一律封鎖
    location / { return 404; }
}
